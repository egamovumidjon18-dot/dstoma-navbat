# Render Blueprint: one always-on web service built from the Dockerfile.
# New → Blueprint on render.com, pick this repo, then fill in the variables marked
# "sync: false" (Render asks for them; they are never stored in git).
#
# Runs on Render's free plan (no payment method needed to start; check Render's
# current docs). Free instances spin down after 15 minutes without inbound traffic
# and take about a minute to wake, and while one sleeps the Telegram bots and the
# daily reminders stop. To keep it awake, have a free uptime monitor request the
# site every 5 minutes (see DEPLOYMENT.md). For a clinic in daily use, change
# `plan` to `starter` (paid, always on).
services:
  - type: web
    name: dstoma
    runtime: docker
    region: frankfurt # near the Firestore database (eur3)
    plan: free
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: APP_URL
        value: https://www.dstoma.online
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: ADMIN_USER
        value: superadmin
      - key: ADMIN_PASS
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DOCTOR_BOT_TOKEN
        sync: false
      - key: REMINDER_HOUR_UTC
        value: "3"
