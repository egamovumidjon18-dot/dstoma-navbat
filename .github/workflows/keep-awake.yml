# Keeps a Render free instance from spinning down during working hours.
# Render puts a free web service to sleep after 15 minutes without inbound traffic;
# while it sleeps the Telegram bots and the daily reminders stop.
#
# Pings the site every 10 minutes (at :03, :13, ...; GitHub drops many jobs queued
# exactly on the hour) from 02:00 to 19:59 UTC (07:00-00:59 in Tashkent).
# That is 18 h a day, about 560 of the workspace's 750 free hours a month, leaving room
# for other free services. Adjust the hours in `cron` for your time zone.
#
# Set the repository variable KEEP_AWAKE_URL (Settings → Secrets and variables →
# Actions → Variables) to change the address; on a paid plan delete this file.
# GitHub may run scheduled jobs hours late (in practice ~5 runs a day here), and pauses
# them after 60 days without commits; server.ts pings itself (startKeepAwake) as the main
# keep-awake, and this workflow only wakes the instance in the morning when it fires.
name: Keep awake

on:
  schedule:
    - cron: "3-59/10 2-19 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request the site
        env:
          URL: ${{ vars.KEEP_AWAKE_URL || 'https://www.dstoma.online/' }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 --retry 2 "$URL")
          echo "$URL -> HTTP $code"
          [ "$code" -lt 500 ]
